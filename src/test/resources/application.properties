# ── Propiedades requeridas por el controlador ──────────────────────────────
api.version=v1
app.version=test

# ── JPA: crear y destruir esquema en cada ejecución de pruebas ─────────────
# Hibernate crea las tablas al inicio y las elimina al terminar
spring.jpa.hibernate.ddl-auto=create-drop

# ── Desactivar import.sql de producción ────────────────────────────────────
# Sin esto, los 12 clientes y 8 regiones del import.sql de producción
# se cargarían en los tests y harían las pruebas impredecibles
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ── Base de datos de pruebas: H2 en memoria (modo PostgreSQL) ───────────────
# El entorno de calificación no tiene Docker ni Postgres. Los tests con
# Testcontainers (@ServiceConnection) sobrescriben esta URL cuando hay Docker.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=
# Vacío = Hibernate detecta el dialecto (H2 o PostgreSQL) según la conexión real
spring.jpa.database-platform=
